# 3D UNet predicting short-range affinities (±1 voxel in x,y,z = 3 channels)
_target_: lowresseg.models.unet.AffinityUNet

spatial_dims: 3
in_channels: 1
# 3 short-range (xyz) + optional 9 long-range (3 per axis at 2,4,8 voxels)
# start with short only
out_channels: 3
channels: [32, 64, 128, 256, 512]
strides:  [2,  2,   2,   2]
num_res_units: 2
dropout: 0.1
norm: "BATCH"
act: "LEAKYRELU"
