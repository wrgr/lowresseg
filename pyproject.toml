[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowresseg"
version = "0.1.0"
description = "Low-resolution (~1µm) neuron segmentation for large EM volumes"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "monai>=1.3",
    "cloud-volume>=8.0",
    "zarr>=2.17",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "tensorboard",
    "tqdm",
    "einops",
    "connected-components-3d",
    "kimimaro>=3.2",
    "zmesh>=1.1",
    "trimesh>=4.0",
    "huggingface_hub>=0.23",
    "crackle-codec",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lowresseg*"]

[project.scripts]
lowresseg-train = "lowresseg.train:main"
lowresseg-predict = "lowresseg.predict:main"
lowresseg-segment = "lowresseg.segment:main"
lowresseg-eval = "lowresseg.evaluate:main"
